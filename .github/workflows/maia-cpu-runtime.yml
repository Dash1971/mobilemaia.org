name: Build non-shared Maia CPU runtime
on:
  workflow_dispatch:
  push:
    branches: [codex/maia-single-cpu]
    paths:
      - '.github/workflows/maia-cpu-runtime.yml'
      - 'tools/build_maia_cpu_runtime.py'
      - 'browser-app/runtime/maia5m-ops.config'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned ORT without shared memory
        run: python3 tools/build_maia_cpu_runtime.py --scratch "$RUNNER_TEMP/maia-cpu-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maia-cpu-unshared
          path: ${{ runner.temp }}/maia-cpu-build/package
          retention-days: 3
      - name: Remove owned intermediates
        if: always()
        shell: python
        run: |
          import pathlib, os, json, shutil
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'maia-cpu-build'
          if path.exists():
            assert json.loads((path/'owner.json').read_text())['owner']=='Mobile Maia non-shared CPU runtime build'
            shutil.rmtree(path)
